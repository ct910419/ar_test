<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      embedded
      gesture-detector
    >
      <a-assets>
        <a-asset-item id="camera-asset" src="./assets/camera.glb"></a-asset-item>
        <a-asset-item id="knife-asset" src="./assets/knife.glb"></a-asset-item>
      </a-assets>

      <!-- Marker 1 -->
      <a-marker
        type="pattern"
        preset="custom"
        url="assets/m01.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
      >
        <a-entity
          scale="10 10 10"
          rotation="270 0 0"
          position="0 -3 0"
          gltf-model="#camera-asset"
          class="clickable"
          gesture-handler
        ></a-entity>
      </a-marker>

      <!-- Marker 2 -->
      <a-marker
        type="pattern"
        preset="custom"
        url="assets/m02.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
      >
      <!-- test cube 
      <a-box position="0 0.5 0" color="#FFC65D"></a-box>  -->

      <!-- knife -->
      <a-entity
        id="knife-model"
        scale="0.8 0.8 0.8"
        position="0 0 0"
        rotation="90 0 0"
        gltf-model="#knife-asset"
        class="clickable"
        gesture-handler
      ></a-entity>

      <!-- red frame
      <a-box
        position="0 2 0"
        scale="2 2 2"
        color="red"
        opacity="0.2"
        wireframe="true"
      ></a-box> -->
      </a-marker>


      <!-- light -->
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 1.2" position="1 1 0"></a-entity>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
